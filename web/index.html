<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Museum · 3D-Rundgang</title>
    <style>
        :root {
            color-scheme: dark;
            --accent: #d5e7a1;
            --muted: #9fa99f
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111413;
            color: #eff1e9;
            font: 15px/1.5 system-ui, sans-serif
        }

        #stage {
            position: fixed;
            inset: 0
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none
        }

        .title {
            position: fixed;
            top: 16px;
            left: 20px;
            font: 600 20px Georgia, serif;
            text-shadow: 0 1px 6px #0009
        }

        .title span {
            color: var(--accent)
        }

        .bar {
            position: fixed;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 6px 6px 14px;
            border: 1px solid #ffffff1c;
            border-radius: 12px;
            background: #0c100ddd;
            backdrop-filter: blur(8px);
            font-size: 12px;
            color: var(--muted)
        }

        button {
            border: 1px solid #343c36;
            background: #242d26;
            border-radius: 9px;
            color: #edf1e5;
            padding: 9px 14px;
            font: 600 13px system-ui;
            cursor: pointer
        }

        button.active {
            background: var(--accent);
            color: #23311c
        }

        #status {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            text-align: center;
            background: radial-gradient(ellipse at 50% 70%, #303c30, #171c19 70%)
        }

        #status[hidden] {
            display: none
        }

        /* Smartphone-Fernbedienung: klein als Symbol, aufgeklappt mit QR-Code. */
        .remote-dialog {
            position: fixed;
            top: 14px;
            right: 14px;
            padding: 6px;
            border: 1px solid #ffffff1c;
            border-radius: 12px;
            background: #0c100ddd;
            backdrop-filter: blur(8px);
            cursor: pointer;
            max-width: 220px;
            text-align: center
        }

        .remote-dialog[hidden],
        .remote-dialog[data-connected="true"]:not(.expanded) {
            display: none
        }

        .remote-dialog svg {
            display: block;
            width: 26px;
            height: 26px;
            margin: 4px;
            color: var(--accent)
        }

        .remote-dialog h2,
        .remote-dialog canvas,
        .remote-dialog p,
        .remote-dialog a,
        .remote-dialog button {
            display: none
        }

        .remote-dialog.expanded {
            padding: 12px
        }

        .remote-dialog.expanded svg {
            display: none
        }

        .remote-dialog.expanded h2 {
            display: block;
            margin: 0 0 8px;
            font-size: .9rem
        }

        .remote-dialog.expanded canvas {
            display: block;
            margin: 0 auto;
            border-radius: 8px;
            background: #fff
        }

        .remote-dialog.expanded canvas[hidden] {
            display: none
        }

        .remote-dialog.expanded canvas[hidden]~a {
            display: block;
            overflow-wrap: anywhere;
            font-size: .72rem;
            color: var(--accent)
        }

        .remote-dialog.expanded p {
            display: block;
            margin: 8px 0 0;
            font-size: .75rem;
            color: var(--muted)
        }

        .remote-dialog.expanded button {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 10px;
            font-size: 12px
        }

        @media (max-width: 700px) {
            .hilfe {
                display: none
            }
        }
    </style>
</head>

<body>
    <div id="stage"><canvas id="viewer"></canvas></div>
    <div class="title">Museum <span>3D-Rundgang</span></div>
    <section id="remote-dialog" class="remote-dialog" aria-labelledby="remote-title" title="Mit dem Smartphone steuern"
        hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="2.8" width="10" height="18.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" />
            <circle cx="12" cy="17.8" r="1" fill="currentColor" />
            <path d="M9.5 7.8c1.4-1.3 3.6-1.3 5 0m-4 2c.8-.7 2.2-.7 3 0" fill="none" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round" />
        </svg>
        <h2 id="remote-title">Mit dem Smartphone steuern</h2>
        <canvas id="remote-qr" width="168" height="168" aria-label="QR-Code zur Smartphone-Steuerung"></canvas>
        <p id="remote-status">Verbindung wird vorbereitet …</p>
        <a id="remote-link" target="_blank" rel="noopener"></a>
        <button id="remote-new-session" type="button">Neuer QR-Code</button>
    </section>
    <div class="bar"><span class="hilfe">W/A/S/D oder Pfeiltasten gehen · Ziehen dreht den Blick · Klick auf Boden
            oder Werk: hingehen · Bild↑/↓ umdrehen</span><button id="viewerWalk" type="button">Rundgang</button></div>
    <div id="status"><div><strong>Das Museum wird geladen …</strong><br><small>Beim ersten Aufruf kann das einen
                Moment dauern.</small></div></div>
    <script
        type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
    <script type="module" src="web.js"></script>
</body>

</html>
